# Amvera Cloud: Docker (Astro static + PHP lead API)
# Docs: https://docs.amvera.ru/applications/configuration/docker.html
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 80
  # Persistent volume for lead logs / rate-limit files
  persistenceMount: /data
